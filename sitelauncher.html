<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kalnia+Glaze:wght@100..700&family=Outfit:wght@100..900&family=Sixtyfour+Convergence:SCAN,XELA,YELA@-5,-100,100&display=swap" rel="stylesheet">
    <title>Site Launcher</title>
    <link rel="stylesheet" href="newstyle.css">
    <style>
      body {
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-style: normal;
        font-size: 24px;
        min-height: 100vh;
        padding: 0px;
        margin: 25px;
        -webkit-backdrop-filter: blur(10px) brightness(110%);
        backdrop-filter: blur(10px) brightness(110%);
        background-color: #ddd;
      }

      .icon-r {
        background-color: #cfc;
        border: 3px solid #beb;
      }
      .icon-b {
        background-color: #ffc;
        border: 3px solid #eeb;
      }
      .icon-f{
        background-color: #fcc;
        border: 3px solid #ebb;
      }
      .icon-f, .icon-b, .icon-r {
        display: inline-flex;
        width: 0.7em;
        height: 0.7em;
        align-items: center;
        justify-content: center;
        border-radius: 100%;
        position: absolute;
        bottom: 50%;
      }

      .tooltip {
        visibility: hidden; /* Hidden by default */
        min-width: 130px;
        background-color: black;
        color: #ffffff;
        text-align: center;
        font-size: 0.9em;
        padding: 5px 0;
        border-radius: 6px 6px 6px 0px;
        position: absolute;
        left: 100%;
        bottom: 50%;
        z-index: 999; /* Ensure tooltip is displayed above content */
      }
      .icon-r:hover .tooltip {
        visibility: visible;
      }
      .icon-b:hover .tooltip {
        visibility: visible;
      }
      .icon-f:hover .tooltip {
        visibility: visible;
      }

      li {
        position: relative;
      }
    </style>
  </head>
  <body>

    <div class="bg">
      <h1>Site Launcher</h1>
      <label for="name">Site Name:</label>
      <input type="text" id="name" name="name">
      <br>
      <select id="mode">
        <option value="ab">Open in about:blank</option>
        <option value="url">Open Regular</option>
      </select>
      <br>
      <label for="new?">Open in new Window?</label>
      <input type="checkbox" id="new" name="new?">
      <br>
      <button id="go">Go <div style="font-weight: 700; display: inline; padding: 3px;">&#x27a0;</div></button>
      <ul id="itemcontainer">
      </ul>
    </div>

    <script>
      let nameInpObj = document.getElementById("name")
      let modeSlctObj = document.getElementById("mode")
      let newWinChkbxObj = document.getElementById("new")
      let goBtnObj = document.getElementById("go")
      let url=''
      let siteNames = ['12wave','eagler1.8','eagler1.12','dashmetry','aviator']
      let siteDnames = ['12Wave: similar to doodle jump <div class="icon-r"></div>','eagler1.8: eaglercraft 1.8 hosted on iammyguy21th\'s github <div class="icon-b"></div>','eagler1.12: eaglercraft 1.12.2 hosted on iammyguy21th\'s github <div class="icon-b"></div>','dashmetry: similar to geometry dash <div class="icon-f"></div>','aviator: fly plane get blue orbs avoid red <div class="icon-b"></div>']
      let siteUrls = ['https://12wave.com','https://iammyguy21th.github.io/eagler/eagler1.8.html','https://iammyguy21th.github.io/eagler/eagler1.12.html','https://dashmetry.io','https://tympanus.net/Tutorials/TheAviator/index.html']

      goBtnObj.addEventListener("click", function() {
        enterHandler(siteUrls[siteNames.findIndex(found => found.toLowerCase() === nameInpObj.value.toLowerCase())])
      })

      function enterHandler(url) {
        if (url) {
          if (modeSlctObj.value=="url") {
            if (newWinChkbxObj.checked) {
              window.open(url, 'Site Opener Output', 'width=400,height=400')
            } else {
              window.open(url, '_blank')
            }
          } else {
            let win
            if (newWinChkbxObj.checked) {
              win = window.open('about:blank', 'Site Opener Output', 'width=400,height=400')
            } else {
              win = window.open('about:blank', '_blank')
            }
            let iframe = win.document.createElement('iframe')
            iframe.src=url
            iframe.style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;"
            win.document.body.appendChild(iframe)
          }
        }
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text)
          alert('Text copied to clipboard')
        } catch (err) {
          alert(`Failed to copy: ${err}`)
        }
      }


      let itemcontainer = document.getElementById("itemcontainer")
      function fillItems() {
        for (let i = 0; i < siteUrls.length; i++) {
          let item = document.createElement('li')
          item.classList.add('listitem')
          item.innerHTML=siteDnames[i]
          item.dataset.url = siteUrls[i]
          item.addEventListener("click", function() {
            enterHandler(siteUrls[i])
          })
          itemcontainer.appendChild(item)
        }
        let iconr = document.getElementsByClassName('icon-r')
        for (let j = 0; j < iconr.length; j++) {
          let rtooltip = document.createElement('span')
          rtooltip.innerHTML='This can only be opened as a regular url.'
          rtooltip.classList.add('tooltip')
          iconr[j].appendChild(rtooltip)
        }
        let iconb = document.getElementsByClassName('icon-b')
        for (let j = 0; j < iconb.length; j++) {
          let btooltip = document.createElement('span')
          btooltip.innerHTML='This can only be opened in about:blank or a method.'
          btooltip.classList.add('tooltip')
          iconb[j].appendChild(btooltip)
        }
        let iconf = document.getElementsByClassName('icon-f')
        for (let j = 0; j < iconf.length; j++) {
          let ftooltip = document.createElement('span')
          ftooltip.innerHTML='This can only be opened using a method.'
          ftooltip.classList.add('tooltip')
          iconf[j].addEventListener("click", function(event) {
            event.stopPropagation() // prevent triggering the li click
            let parentLi = this.closest("li")
            copyText(parentLi.dataset.url)
          })
          iconf[j].appendChild(ftooltip)
        }
      }

      fillItems()
    </script>
  </body>
</html>
