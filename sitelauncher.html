<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kalnia+Glaze:wght@100..700&family=Outfit:wght@100..900&family=Sixtyfour+Convergence:SCAN,XELA,YELA@-5,-100,100&display=swap" rel="stylesheet">
    <title>Site Launcher</title>
    <style>
      body {
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-style: normal;
        font-size: 16px;
        min-height: 100vh;
        padding: 0px;
        margin: 25px;
        -webkit-backdrop-filter: blur(10px) brightness(110%);
        backdrop-filter: blur(10px) brightness(110%);
        background-color: #ddd;
      }
      
      
      .bg {
        min-height: 100vh;
        padding: 10px;
        margin: 0px;
        -webkit-backdrop-filter: blur(10px) brightness(110%);
        backdrop-filter: blur(10px) brightness(110%);
        background-color: #eee;
        box-shadow: 0px 3px 10px -2px #0004 inset;
      }

      label {
        padding: 3px;
        position: relative;
        left: 20px;
        line-height: 2em;
      }

      input {
        position: relative;
        left: 20px;
        box-shadow: 0px 2px 5px 2px #0002;
        border-radius: 5px;
        border: 3px solid #ccc;
        transition: all 0.3s;
        accent-color: #d91;
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      input[type="checkbox"] {
        border-radius: 100%;
      }

      input:hover {
        box-shadow: 0px 3px 10px 4px #0004;
        border-color: #bbb;
      }

      select {
        position: relative;
        left: 30px;
        box-shadow: 0px 2px 5px 2px #0002;
        border-radius: 5px;
        border: 3px solid #ccc;
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        transition: all 0.3s;
      }

      select:hover {
        box-shadow: 0px 3px 10px 4px #0004;
        border-color: #bbb;
      }

      button {
        position: relative;
        left: 30px;
        font-size: 1.1em;
        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
        display: flex;
        align-items: center;
        box-shadow: 0px 2px 5px 2px #0002;
        border-radius: 100px;
        border: 3px solid #ccc;
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-style: normal;
        transition: all 0.3s;
      }

      button:hover {
        box-shadow: 0px 3px 10px 4px #0004;
        border-color: #bbb;
      }

      .card {
        box-shadow: 0px 2px 10px 2px #0008;
        padding: 25px;
        margin: 5px;
        border-radius: 25px;
        border: 5px solid #ccc;
        background-color: #eee;
        transition: all .3s;
      }

      .card:hover {
        box-shadow: 0px 4px 18px 2px #0008;
        border: 5px solid #c0c0c0;
      }

      .centeredmax {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 0px;
        margin: 0px;
      }
    </style>
  </head>
  <body>

    <div class="bg">
      <h1>Site Launcher</h1>
      <label for="name">Site Name:</label>
      <input type="text" id="name" name="name">
      <br>
      <select id="mode">
        <option value="ab">Open in about:blank</option>
        <option value="url">Open Regular</option>
      </select>
      <br>
      <label for="new?">Open in new Window?</label>
      <input type="checkbox" id="new" name="new?">
      <br>
      <button id="go">Go <div style="font-weight: 700; display: inline; padding: 3px;">&#x27a0;</div></button>
    </div>

    <script>
      let nameInpObj = document.getElementById("name")
      let modeSlctObj = document.getElementById("mode")
      let newWinChkbxObj = document.getElementById("new")
      let goBtnObj = document.getElementById("go")
      let url=''
      let siteNames = ['test']
      let siteUrls = ['https://example.com']

      goBtnObj.addEventListener("click", function() {
        enterHandler()
      })

      function enterHandler() {
        if (nameInpObj.value.trim() != '') {
          url=siteUrls[siteNames.findIndex(found => found === nameInpObj.value]
          if (modeSlctObj.value=="url") {
            if (newWinChkbxObj.checked) {
              window.open(url, 'Site Opener Output', 'width=400,height=400')
            } else {
              window.open(url, '_blank')
            }
          } else {
            let win
            if (newWinChkbxObj.checked) {
              win = window.open('about:blank', 'Site Opener Output', 'width=400,height=400')
            } else {
              win = window.open('about:blank', '_blank')
            }
            let iframe = win.document.createElement('iframe')
            iframe.src=url
            iframe.style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;"
            win.document.body.appendChild(iframe)
          }
        }
      }
    </script>
  </body>
</html>
